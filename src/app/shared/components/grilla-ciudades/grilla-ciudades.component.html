<div class="grid">
    <div class="col-12">
        <p-table #dt [value]="listaCiudades" [columns]="cols" responsiveLayout="scroll" [rows]="10"
            [globalFilterFields]="['nombre', 'idPais']" [rows]="10" [paginator]="true" [rowsPerPageOptions]="[10,20,30,50,100]"
            [showCurrentPageReport]="true"
            currentPageReportTemplate="{first}-{last} de {totalRecords} elementos" [rowHover]="true"
            dataKey="id">
            <ng-template pTemplate="caption">
                <div class="flex flex-column md:flex-row md:justify-content-between md:align-items-center">
                    <button pButton class="p-button p-button-success" label="Agregar" icon="pi pi-plus"
                    (click)="openForm(undefined)"></button>

                    <span class="block mt-2 md:mt-0 p-input-icon-left">
                        <i class="pi pi-search"></i>
                        <input pInputText type="text" (input)="onGlobalFilter(dt, $event)" placeholder="Buscar..."
                            class="w-full sm:w-auto" />
                    </span>
                </div>
            </ng-template>
            <ng-template pTemplate="header">
                <tr>
                    <th>País</th>
                    <th pSortableColumn="idPais">País<p-sortIcon field="idPais"></p-sortIcon></th>
                    <th pSortableColumn="nombre">Nombre<p-sortIcon field="nombre"></p-sortIcon></th>
                    <th>Acciones</th>
                </tr>
            </ng-template>
            <ng-template pTemplate="body" let-element>
                <tr>
                    <td style="width:10%; min-width:10rem;"><span class="p-column-title">País</span>
                        <img [src]="element?.pais?.imagen" [alt]="element?.pais?.nombre" width="64px" height="64px" class="shadow-4" />
                    </td>
                    <td>
                        <span class="p-column-title">País</span>
                        {{element?.pais?.nombre}}
                    </td>
                    <td>
                        <span class="p-column-title" class="p-column-title">Nombre</span>
                        {{element.nombre}}
                    </td>
                    <td style="width:14%; min-width:10rem;">
                        <div class="flex">
                            <button pButton pRipple icon="pi pi-pencil" class="p-button-rounded p-button-success mr-2"
                                (click)="openForm(element)"></button>
                            <button pButton pRipple icon="pi pi-trash" class="p-button-rounded p-button-danger"
                                (click)="deleteElement(element)"></button>
                        </div>
                    </td>
                </tr>
            </ng-template>
        </p-table>
    </div>
    <p-dialog header={{title()}} [(visible)]="display" [modal]="true" showEffect="fade"
        [style]="{width: '50vw', minHeight: '30vh', height: '90%'}" [breakpoints]="{'960px': '75vw'}">
        <app-form-ciudades [element]="selectedElement()"></app-form-ciudades>
    </p-dialog>
</div>
